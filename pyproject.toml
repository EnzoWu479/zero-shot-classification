[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-rl-neural-network"
version = "0.1.0"
description = "Deep Learning Neural Network with Reinforcement Learning - Pure Python Implementation"
authors = [
    {name = "Deep RL Team", email = "team@deeprl.dev"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.7"
keywords = ["machine-learning", "neural-network", "reinforcement-learning", "deep-learning", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# No external dependencies - Pure Python implementation
dependencies = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "pytest-xdist>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.910",
]

[tool.setuptools.packages.find]
where = ["src"]
